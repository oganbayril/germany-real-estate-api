[project]
name = "germany-real-estate-api"
version = "0.1.0"
description = "German real-estate price predictor: ImmoScout24 scraper -> Postgres -> XGBoost -> FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.25",
    "tenacity>=9.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "slowapi>=0.1.9",
]

[project.scripts]
realestate-scrape = "realestate.scraper.cli:main"
realestate-train = "realestate.model.train:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realestate"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
